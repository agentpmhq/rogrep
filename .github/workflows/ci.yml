name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build (deny warnings)
        run: RUSTFLAGS="-D warnings" cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
