name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "crates/rogrep/src/**"
      - "crates/rogrep/assets/SKILL.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "eleventy.config.mjs"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * 1"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build CLI reference, Eleventy site, and Pagefind index
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
